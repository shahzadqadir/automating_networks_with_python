version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname PE2
!
boot-start-marker
boot-end-marker
!
!
vrf definition cust_a
 rd 200.0.0.6:101
 !
 address-family ipv4
  route-target export 100:101
  route-target import 100:101
 exit-address-family
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
!
!
!
no ip domain lookup
ip domain name shahzadqadir.com
ip cef
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
username script privilege 15 password 0 cisco123
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 200.0.0.6 255.255.255.255
!
interface FastEthernet0/0
 vrf forwarding cust_a
 ip address 192.168.100.5 255.255.255.252
 ip ospf network point-to-point
 duplex full
!
interface FastEthernet1/0
 no ip address
 ip ospf network point-to-point
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet1/1
 ip address 10.10.36.6 255.255.255.0
 ip ospf network point-to-point
 speed auto
 duplex auto
!
interface FastEthernet2/0
 ip address 10.10.46.6 255.255.255.0
 ip ospf network point-to-point
 speed auto
 duplex auto
!
interface FastEthernet2/1
 ip address 10.10.99.6 255.255.255.0
 speed auto
 duplex auto
!
router ospf 1
 passive-interface default
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet1/1
 no passive-interface FastEthernet2/0
 network 0.0.0.0 255.255.255.255 area 0
 mpls ldp autoconfig
!
router bgp 65001
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 200.0.0.1 remote-as 65001
 neighbor 200.0.0.1 update-source Loopback0
 neighbor 200.0.0.2 remote-as 65001
 neighbor 200.0.0.2 update-source Loopback0
 !
 address-family ipv4
 exit-address-family
 !
 address-family vpnv4
  neighbor 200.0.0.1 activate
  neighbor 200.0.0.1 send-community both
  neighbor 200.0.0.2 activate
  neighbor 200.0.0.2 send-community both
 exit-address-family
 !
 address-family ipv4 vrf cust_a
  neighbor 192.168.100.6 remote-as 65003
  neighbor 192.168.100.6 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 exec-timeout 0 0
 login local
 transport input ssh
!
!
end