version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname P4
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
!
!
!
no ip domain lookup
ip domain name shahzadqadir.com
ip cef
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
username script privilege 15 password 0 cisco123
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 200.0.0.4 255.255.255.255
!
interface FastEthernet0/0
 ip address 10.10.34.4 255.255.255.0
 ip ospf network point-to-point
 duplex full
!
interface FastEthernet1/0
 ip address 10.10.24.4 255.255.255.0
 ip ospf network point-to-point
 speed auto
 duplex auto
!
interface FastEthernet1/1
 ip address 10.10.14.4 255.255.255.0
 ip ospf network point-to-point
 speed auto
 duplex auto
!
interface FastEthernet2/0
 ip address 10.10.46.4 255.255.255.0
 ip ospf network point-to-point
 speed auto
 duplex auto
!
interface FastEthernet2/1
 ip address 10.10.99.4 255.255.255.0
 speed auto
 duplex auto
!
router ospf 1
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet1/1
 no passive-interface FastEthernet2/0
 network 0.0.0.0 255.255.255.255 area 0
 mpls ldp autoconfig
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 exec-timeout 0 0
 login local
 transport input ssh
!
!
end